services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: my_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./customer-feedback-backend
    env_file:
      - ./customer-feedback-backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/my_db
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build: ./customer-feedback-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge